<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobMatch Mockup Gallery – iPhone 16 Pro Max</title>
<style>
  :root { --brand:#0C70F8; --ink:#0F172A; --muted:#5B6577; --line:#E3E8EF; --bg:#F5F7FA; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); padding:32px 24px 64px; }
  .wrap { max-width:1360px; margin:0 auto; }
  header { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:28px; }
  h1 { margin:0; font-size:28px; letter-spacing:-.02em; }
  .sub { margin:4px 0 0; color:var(--muted); }
  h2 { margin:36px 0 16px; font-size:20px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:22px; }
  .shot-card { margin:0; background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; box-shadow:0 4px 16px rgba(15,23,42,.05); }
  .shot-img { display:flex; justify-content:center; padding:6px 0; background:#F8FAFC; border-radius:12px; }
  .shot-img img { width:100%; max-width:220px; height:auto; display:block; }
  .meta { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .pill { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:999px; }
  .pill.seeker { background:#EBF3FF; color:#0952B8; }
  .pill.employer { background:#E8F7EF; color:#14804F; }
  .route { font-size:11.5px; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  figcaption h3 { margin:0 0 4px; font-size:15px; }
  figcaption p { margin:0 0 8px; font-size:13px; color:var(--muted); }
  .step { font-size:11.5px; font-weight:600; color:var(--brand); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>JobMatch iPhone 16 Pro Max Mockup Gallery</h1>
        <p class="sub">27 framed screens (17 Job Seeker + 10 Employer) · Captured at 440 × 956 pt @ 3× (1320 × 2868 px raw)</p>
      </div>
    </header>
    <h2>Job Seeker Journey (17 screens)</h2>
    <div class="grid">
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-01-welcome.png" alt="Welcome to JobMatch" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/</span></div>
        <h3>Welcome to JobMatch</h3>
        <p>Start your job search with transparent match scores built for Biñan and Laguna.</p>
        <div class="step">Hero / Phase 1</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-03-signup.png" alt="Create your account" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/signup</span></div>
        <h3>Create your account</h3>
        <p>Enter your full name, email, and an 8+ character password to create your account.</p>
        <div class="step">Phase 1 – Step 1</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-02-choose-role.png" alt="Choose account type" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/role</span></div>
        <h3>Choose account type</h3>
        <p>Pick "I am looking for a job" to start your personal job matching and career plan.</p>
        <div class="step">Phase 1 – Step 2</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-04-onboarding-skills.png" alt="Onboarding – Skills (categorized picker)" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/onboarding (Step 3 of 5)</span></div>
        <h3>Onboarding – Skills (categorized picker)</h3>
        <p>Browse 300+ categorized skills, pick Suggested for you, and set your level for each skill.</p>
        <div class="step">Phase 2 – Step 3</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-05-onboarding-resume.png" alt="Onboarding – Résumé auto-fill result" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/onboarding (Step 4 of 5)</span></div>
        <h3>Onboarding – Résumé auto-fill result</h3>
        <p>Tap Update All Info to auto-fill skills, education, and summary while keeping personal details protected.</p>
        <div class="step">Phase 2 – Step 4</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-06-onboarding-goals.png" alt="Onboarding – Goals & work setups" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/onboarding (Step 5 of 5)</span></div>
        <h3>Onboarding – Goals & work setups</h3>
        <p>Pick your target career role, accepted work setups (On-site, Hybrid, Remote), and pay goal.</p>
        <div class="step">Phase 2 – Step 5</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-07-profile-hero.png" alt="Your profile" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/profile</span></div>
        <h3>Your profile</h3>
        <p>Complete your circular profile photo, 3:4 portrait, and details to reach 100% profile strength.</p>
        <div class="step">Phase 3 – Step 1</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-08-discover-card.png" alt="Discover – matched job card" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/deck</span></div>
        <h3>Discover – matched job card</h3>
        <p>Swipe right to save, left to pass, up to star, or tap any card to see your full match breakdown.</p>
        <div class="step">Phase 4 – Step 1</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-09-discover-filters.png" alt="Discover – Filter jobs" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/deck (Filters modal)</span></div>
        <h3>Discover – Filter jobs</h3>
        <p>Filter jobs by commute limit, work setup (On-site, Hybrid, Remote), employment type, area, and minimum pay.</p>
        <div class="step">Phase 4 – Step 2</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-17-upcoming-interview.png" alt="Upcoming interview on Discover" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/deck (Upcoming Interviews)</span></div>
        <h3>Upcoming interview on Discover</h3>
        <p>Scheduled interviews appear at the top of Discover so you can review details and tap Confirm in one tap.</p>
        <div class="step">Phase 8 – Step 1</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-10-job-details.png" alt="Job details & match breakdown" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/jobs/:id</span></div>
        <h3>Job details & match breakdown</h3>
        <p>See exactly how your skills (55%), location (20%), interests (15%), and pay (10%) build your match score.</p>
        <div class="step">Phase 5 – Step 1</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-11-career-job.png" alt="Career breakdown for a job" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/career/job/:id</span></div>
        <h3>Career breakdown for a job</h3>
        <p>Check your readiness ring, learning progress, and exact skills needed for any job listing.</p>
        <div class="step">Phase 5 – Step 2</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-12-career-roadmap.png" alt="Career roadmap & career path" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/career/role/:id</span></div>
        <h3>Career roadmap & career path</h3>
        <p>Follow weekly Learn and Practice tasks, pass skill quizzes, and track your Entry-to-Senior career path.</p>
        <div class="step">Phase 9 – Step 1</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-13-resume-review.png" alt="Résumé review results" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/resume-review</span></div>
        <h3>Résumé review results</h3>
        <p>Get an instant score, strong areas, specific fixes with examples, and employer-appeal tips.</p>
        <div class="step">Phase 3 – Step 2</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-14-applications.png" alt="Applications & status timeline" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/applications</span></div>
        <h3>Applications & status timeline</h3>
        <p>Track every application from Applied to Shortlisted or Hired, plus employer view status and Insights.</p>
        <div class="step">Phase 6 – Step 2</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-15-matches.png" alt="Matches – contact details shared" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/matches</span></div>
        <h3>Matches – contact details shared</h3>
        <p>Once shortlisted, employer contact details appear and a direct chat opens.</p>
        <div class="step">Phase 6 – Step 3</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="seeker">
      <div class="shot-img"><img src="seeker-16-messages-menu.png" alt="Messages – long-press options" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill seeker">seeker</span><span class="route">#/messages/:id</span></div>
        <h3>Messages – long-press options</h3>
        <p>Press and hold any message to Reply, Copy, Edit, Unsend, or Remove for you.</p>
        <div class="step">Phase 7 – Step 2</div>
      </figcaption>
    </figure></div>
    <h2>How Employers Find You (10 screens)</h2>
    <div class="grid">
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-01-overview.png" alt="Employer overview dashboard" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/employer</span></div>
        <h3>Employer overview dashboard</h3>
        <p>Employers see live jobs, applicants, matches, views, and upcoming interviews in one dashboard.</p>
        <div class="step">Appendix – Employer Overview</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-02-post-job.png" alt="Post a job" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/employer/jobs/new</span></div>
        <h3>Post a job</h3>
        <p>Employers pick a career role, work setup (On-site, Hybrid, or Remote), 4:3 photo, and required skills.</p>
        <div class="step">Appendix – Step 1</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-03-jobs-list.png" alt="Employer jobs list" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/employer/jobs</span></div>
        <h3>Employer jobs list</h3>
        <p>Every live listing shows work setup, pay range, status, and total applicant count.</p>
        <div class="step">Appendix – Step 2</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-04-applicants.png" alt="Ranked applicants with match scores" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/employer/jobs/:id/applicants</span></div>
        <h3>Ranked applicants with match scores</h3>
        <p>Applicants are ranked by fit with masked names until the employer chooses to shortlist.</p>
        <div class="step">Appendix – Step 3</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-05-applicant-drawer.png" alt="Applicant review drawer" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/employer/jobs/:id/applicants (Drawer)</span></div>
        <h3>Applicant review drawer</h3>
        <p>Employers review skills, work setups, education, and summary fairly—contact details appear only after shortlisting.</p>
        <div class="step">Appendix – Step 3</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-06-schedule-interview.png" alt="Schedule interview modal" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/employer/jobs/:id/applicants (Modal)</span></div>
        <h3>Schedule interview modal</h3>
        <p>Once shortlisted, employers schedule an Online or On-site interview and send an instant invite.</p>
        <div class="step">Appendix – Step 4</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-07-candidate-search.png" alt="Candidate search & invites" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/employer/candidates</span></div>
        <h3>Candidate search & invites</h3>
        <p>Employers can discover opted-in seekers matched to their open roles and invite them to apply.</p>
        <div class="step">Appendix – Step 2</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-08-analytics.png" alt="Employer analytics" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/employer/analytics</span></div>
        <h3>Employer analytics</h3>
        <p>Hiring trends, views, saves, and application rates help employers improve their job listings.</p>
        <div class="step">Appendix – Step 5</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-09-company.png" alt="Verified company profile" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/employer/company</span></div>
        <h3>Verified company profile</h3>
        <p>Every employer completes document verification to earn the Verified badge shown to seekers.</p>
        <div class="step">Appendix – Step 1</div>
      </figcaption>
    </figure>
    <figure class="shot-card" data-p="employer">
      <div class="shot-img"><img src="employer-10-messages.png" alt="Messages with a candidate" loading="lazy"></div>
      <figcaption>
        <div class="meta"><span class="pill employer">employer</span><span class="route">#/messages/:id</span></div>
        <h3>Messages with a candidate</h3>
        <p>Employers chat directly with shortlisted candidates using quick replies and message tools.</p>
        <div class="step">Appendix – Step 4</div>
      </figcaption>
    </figure></div>
  </div>
</body>
</html>
